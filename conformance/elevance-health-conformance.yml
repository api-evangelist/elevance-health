  detail: FHIR Bundle paging. The DSTU2 server declares a getPage system operation; R4 servers use standard Bundle link relations with _count.
- id: rfc9457
  conforms: false
  detail: >-
    Errors are not RFC 9457 problem+json. The FHIR surfaces return OperationOutcome; the TotalView
