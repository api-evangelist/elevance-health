domain_standard:
  standard: HL7 FHIR
  declared_in_contract: true
  evidence: >-
    Every retrieved contract declares itself in the standard's own vocabulary rather than claiming
    conformance in prose: resourceType "CapabilityStatement" (R4) / root element <Conformance> (DSTU2),
    with an explicit fhirVersion of 4.0.1 and 1.0.2 respectively, resource profiles referencing
    hl7.org/fhir/StructureDefinition/*, and a restful-security-service coding of "SMART-on-FHIR".
  regime: health
  note: >-
    FHIR is the domain standard for US payer interoperability and it is what CMS-9115-F requires.
    An integrator who already speaks FHIR needs no bespoke connector for these endpoints.
