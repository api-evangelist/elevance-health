notes:
- Every candidate tool is read-only, because every CMS Interoperability surface Elevance publishes is
  read-only.
- 'The provider-directory tools are the only ones that could plausibly serve an unattended agent: they
  carry no member PHI and need only a client-credentials token. The patient-access tools require an individual
  member to complete a SMART consent flow, which an agent cannot do on its own behalf.'
- 'Real input schemas are available without invention: each tool inherits the searchParam list the capability
  statement declares for its resource.'
