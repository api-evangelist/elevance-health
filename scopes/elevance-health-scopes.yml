generated: '2026-09-07'
method: probed
source: Anonymous GET of the SMART App Launch and OpenID Connect discovery documents on each Elevance
  Health FHIR host
docs: https://patient360c.anthem.com/P360Member/fhir/documentation
description: OAuth 2.0 / SMART on FHIR scopes actually advertised by Elevance Health, read from the providers
  own discovery documents rather than inferred. Supersedes the 2026-07-11 derived file, which listed three
  scopes taken from a hand-written scaffold spec.
summary:
  schemes: 3
  scopes_total: 272
  patient360_smart_scopes: 205
  totalview_patient_access_scopes: 67
  patient360_identityserver_oidc_scopes: 1048
notes:
- The Patient360 IdentityServer OpenID Connect discovery document advertises 1048 scopes, a superset that
  covers the whole CareEvolution HIEBus resource surface. Only the 205 scopes the SMART configuration
  advertises for the FHIR base are enumerated here; the full list is in well-known/elevance-health-patient360c-openid-configuration.json.
- The Provider Directory and Formulary APIs use OAuth 2.0 client credentials and publish no scope list;
  their token endpoint is issued privately by secure email after registration.
