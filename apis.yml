  - aid: elevance-health:provider-directory
    name: Elevance Health Provider Directory API
    description: >-
      The Provider Directory API exposes which practitioners and organizations are in-network for a given
      Elevance Health insurance plan. HL7 FHIR R4 conforming to Da Vinci PDEX Plan Net 1.1.0 and US Core
      STU 3.1.1, exposing HealthcareService, InsurancePlan, Location, Organization, OrganizationAffiliation,
      Practitioner, PractitionerRole and Specimen — 25 interactions, all read-only. Its CapabilityStatement
      is readable with no credentials at all, which makes it the only Elevance surface an unattended agent
      can inspect before integrating; data access itself uses OAuth 2.0 client credentials issued by secure
      email after registration.
    humanURL: https://www.anthem.com/developers
    tags:
      - FHIR
      - Provider Directory
      - Healthcare
      - Interoperability
    properties:
      - type: Documentation
        url: https://totalview.healthos.elevancehealth.com/fhir/documentation
      - type: APIReference
        url: >-
          https://www.anthem.com/content/dam/digital/developers-portal/Anthem-IOProviderDirectoryAndFormulary-API-Documentation.pdf
      - type: Conformance
        url: conformance/elevance-health-provider-directory-capabilitystatement.json
      - type: SignUp
        url: https://www.anthem.com/developers/provider-directory-api-request
    baseURL: >-
      https://totalview.healthos.elevancehealth.com/resources/unregistered/api/v1/fhir/cms_mandate/mcd/
  - aid: elevance-health:formulary
    name: Elevance Health Formulary API
    description: >-
      The Formulary API publishes drug coverage for Elevance-affiliated Medicare, Medicaid and CHIP plans
      — covered drug lists, tier placement, pharmacy type and cost-sharing. HL7 FHIR R4 conforming to
      Da Vinci PDEX US Drug Formulary IG 2.0.1 STU2, carried on InsurancePlan (PayerInsurancePlan and
      Formulary), Basic (FormularyItem) and MedicationKnowledge (FormularyDrug). Read-only, authorized
      with OAuth 2.0 client credentials. The endpoint returns HTTP 403 with an empty body until an application
      is registered, so its capability statement could not be retrieved; the resource and search-parameter
      set recorded here comes from the provider’s own endpoint support document rather than from the contract.
    humanURL: https://www.anthem.com/developers
    tags:
      - FHIR
