  note: >-
    CMS-9115-F requires member data access to be free of charge, and Elevance publishes no price list
    of any kind. A self-service sandbox with synthetic data exists, which is why trial is true; production
    access requires a request form, a documented security risk analysis and an approval Elevance says
    can take several weeks, which is why onboarding is not self-serve.
apis:
  - aid: elevance-health:patient-access
    name: Elevance Health Patient Access API
    description: >-
      The Patient Access API gives Elevance Health members, through an application they authorize, up
      to five years of their medical, pharmacy, dental and vision claims and clinical data. It is HL7
      FHIR R4 (4.0.1) against US Core 6.1.0 and the CARIN IG for Blue Button STU 2.1.0, authorized with
      SMART App Launch 2.2.0 and member consent. Production is tenanted: there are thirteen brand-specific
      base URLs under totalview.healthos.elevancehealth.com/resources/registered/{Brand}/api/v1/fhir,
      of which AnthemBlueCross is recorded here as the representative. The capability statement declares
      27 resource types and 106 interactions, all read-only. A public sandbox with synthetic data is available
      on self-service registration; production access requires an approval that Elevance says takes several
      weeks.
    humanURL: https://www.anthem.com/developers
    baseURL: >-
      https://totalview.healthos.elevancehealth.com/resources/registered/AnthemBlueCross/api/v1/fhir
    tags:
      - FHIR
