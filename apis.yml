aid: elevance-health
name: Elevance Health
url: https://raw.githubusercontent.com/api-evangelist/elevance-health/refs/heads/main/apis.yml
description: >-
  Elevance Health (formerly Anthem) is a Fortune 500 health benefits company serving members through Blue
  Cross and Blue Shield affiliated health plans across multiple states, offering medical, pharmacy, dental,
  vision and specialty insurance. Its entire public API surface is HL7 FHIR, published to satisfy the
  CMS Interoperability and Patient Access Final Rule: a member-consented Patient Access API (FHIR R4,
  CARIN Blue Button, SMART on FHIR), a read-only Provider Directory API (Da Vinci PDEX Plan Net) whose
  CapabilityStatement is readable with no credentials, a Formulary API (Da Vinci PDEX US Drug Formulary),
  and a legacy Patient360 FHIR DSTU2 endpoint running CareEvolution HIEBus. There is no OpenAPI, no SDK
  and no pricing — the contracts are the FHIR CapabilityStatements the servers publish about themselves.
  Elevance has committed in its own endpoint support document to shipping Payer-to-Payer, Prior Authorization
  and Provider Access APIs by 1 January 2027 under CMS-0057-F; none of the three exists today.
