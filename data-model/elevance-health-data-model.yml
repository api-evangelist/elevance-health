notes:
- Basic is the FHIR resource Da Vinci uses to carry a FormularyItem; MedicationKnowledge carries a FormularyDrug.
- Patient.$everything is the only instance-level operation exposed, and it is the closest thing to a bulk
  read on this estate. No $export is declared.
- Every entity on every CMS surface is read-only. The write surface in this estate is the legacy Patient360
  DSTU2 server, whose resource set is documented in conformance/elevance-health-patient360-dstu2-conformance.xml.
