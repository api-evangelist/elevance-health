description: >-
  Elevance Health publishes no dated API changelog or release-notes page. The developer portal says
  to "visit our Developer Portal often for the latest API release notes", but no such page is served —
  probed https://www.anthem.com/developers and its sitemap entries, and no release-notes URL exists.
  The only versioned, dated record of change Elevance publishes about its API estate is the
  controlled document that governs the endpoints, so that is what is recorded here.
