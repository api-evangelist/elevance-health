specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Elevance Health
providerId: elevance-health
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Healthcare
  - Health Insurance
  - FHIR
  - Interoperability
description: Elevance Health (formerly Anthem) exposes CMS Interoperability and Patient Access FHIR APIs.
  Per the CMS Interoperability and Patient Access Final Rule, member access to claims and clinical data
  must be free of charge to members and to consumer-direction app developers; provider directory and
  formulary endpoints are publicly readable. There is no per-call price list. Plans capture the access
  channels.
notes: Public per-call pricing for Elevance Health FHIR APIs is not published; CMS rules require free
  patient access. Replace with provider-confirmed values if Elevance later monetizes a non-CMS API surface.
sources:
  - https://www.anthem.com/developers
  - https://patient360c.anthem.com/P360Member/fhir/documentation
  - https://www.cms.gov/Regulations-and-Guidance/Guidance/Interoperability/index
plans:
  - id: elevance-health-patient-access
    name: Patient Access (CMS-Mandated)
    type: freemium
    description: Free, member-authorized FHIR access to claims, clinical, pharmacy, dental, and vision
      data. Up to five years of historical data per CARIN BB IG.
    entries:
      - label: Member-authorized FHIR access
        name: patient_access_calls
        type: quota
        metric: requests
        limit: -1
        timeFrame: month
        geo: US
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: HL7 FHIR R4
      - name: CARIN Consumer-Directed Payer Data Exchange IG
      - name: SMART-on-FHIR member auth
  - id: elevance-health-provider-directory
    name: Provider Directory (Public)
    type: freemium
    description: Publicly readable FHIR Provider Directory; no authentication required.
    entries:
      - label: Provider directory access
        name: provider_directory_calls
        type: quota
        metric: requests
        limit: -1
        timeFrame: month
        geo: US
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: DaVinci PDEX Plan Net IG
      - name: Practitioner / PractitionerRole / Organization / Location / InsurancePlan
  - id: elevance-health-formulary
    name: Drug Formulary (Public)
    type: freemium
    description: Publicly readable drug-formulary FHIR API.
    entries:
      - label: Formulary access
        name: formulary_calls
        type: quota
        metric: requests
        limit: -1
        timeFrame: month
        geo: US
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: DaVinci PDEX US Drug Formulary IG
      - name: Tier placement and prior-auth flags
  - id: elevance-health-payer-to-payer
    name: Payer to Payer
    type: enterprise
    description: Inter-payer FHIR exchange under the CMS Interoperability and Prior Authorization rule.
      Available to other payers under data-exchange agreements.
    entries:
      - label: Payer-to-payer exchange
        name: payer_to_payer_calls
        type: quota
        metric: requests
        limit: -1
        timeFrame: month
        geo: US
        unit: 1
        price: contact partner
        userMultiplied: false
    elements:
      - name: Member coverage and clinical exchange
      - name: HL7 FHIR R4
maintainers:
  - FN: API Evangelist
    email: info@apievangelist.com
