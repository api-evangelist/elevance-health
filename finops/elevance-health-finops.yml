specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Elevance Health
providerId: elevance-health
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - FOCUS
  - Healthcare
  - FHIR
  - Interoperability
description: 'FOCUS-aligned FinOps shell for Elevance Health: CMS Interoperability FHIR APIs are free
  to consumers per regulation, so this artifact tracks the operational cost-of-serve rather than billed
  consumption. Meters describe FHIR call volume by endpoint to support internal cost accounting.'
notes: Elevance Health does not bill external consumers for CMS-mandated FHIR access. FOCUS mapping
  here serves Elevance internal accounting (compute and infrastructure attribution) rather than external
  invoice reconciliation.
sources:
  - https://www.anthem.com/developers
  - https://www.cms.gov/Regulations-and-Guidance/Guidance/Interoperability/index
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Elevance Health, Inc.
serviceCategory: Healthcare Interoperability
billingModel:
  pricingCategory: Free (regulated)
  billingFrequency: N/A
  billingCurrency: USD
  chargeCategories:
    - Adjustment
focusColumns:
  ServiceName: Elevance Health FHIR APIs
  ServiceCategory: Healthcare Interoperability
  ProviderName: Elevance Health
  PublisherName: Elevance Health, Inc.
  InvoiceIssuerName: Elevance Health, Inc.
  BillingCurrency: USD
  ChargeCategory: Adjustment
meters:
  - name: fhir_requests
    unit: request
    aggregation: sum
    dimensions:
      - api
      - resource
      - app
  - name: registered_apps
    unit: app
    aggregation: count
    dimensions:
      - api
  - name: member_authorizations
    unit: authorization
    aggregation: count
    dimensions:
      - api
principles:
  - name: Visibility
    description: Track FHIR call volume per registered app; expose to Elevance compliance team for CMS
      reporting.
  - name: Allocation
    description: Allocate gateway and FHIR backend infrastructure cost across Patient Access, Provider
      Directory, Formulary, and Payer-to-Payer.
  - name: Optimization
    description: Cache public Provider Directory and Formulary responses; right-size FHIR cluster autoscaling
      to actual traffic profile.
  - name: Accountability
    description: Interoperability program owner reviews call volume and gateway cost monthly; reports
      compliance metrics to the CMS-mandated annual filing.
maintainers:
  - FN: API Evangelist
    email: info@apievangelist.com
