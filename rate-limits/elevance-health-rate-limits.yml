description: >-
  Elevance Health documents no rate limits for any of its APIs, and returns no rate-limit headers.
  This was checked against all four developer-facing documentation surfaces and against live
  responses; the honest result is zero. A consumer cannot size a workload, cannot tell how close to
  a ceiling they are, and cannot distinguish throttling from failure, because the runtime signal an
  agent would need is simply not emitted.
limit_count: 0
limits: []
headers_published: false
headers: []
headers_observed: []
status_code_on_exhaustion: null
retry_after: false
notes:
- >-
  Probed for X-RateLimit-*, RateLimit-* and Retry-After on live anonymous responses from
  patient360.anthem.com, patient360c.anthem.com and totalview.healthos.elevancehealth.com. None present.
- >-
  Supersedes the 2026-05-04 generated file, which listed four limit entries whose values were
  "see Anthem developer portal" and "varies", and asserted a 429 + Retry-After behaviour that is
  not documented and was not observed. Those were placeholders presented as data.
- >-
  A 403 with an empty body is what an unregistered caller gets on the gated surfaces; it is an
  authorization outcome, not throttling.
- >-
  The CMS Interoperability and Patient Access Final Rule prohibits a payer from blocking member
  access but does not prohibit reasonable throttling, so limits may well exist and simply be
  unpublished. Recorded as undocumented rather than as absent.
