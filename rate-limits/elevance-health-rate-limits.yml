specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Elevance Health
providerId: elevance-health
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - Healthcare
  - FHIR
  - Interoperability
description: Elevance Health does not publish a single canonical rate-limit specification for its CMS
  Interoperability FHIR APIs. Limits are enforced at the FHIR gateway and applied per registered application;
  member-app developers should follow CMS / CARIN guidance plus the developer-portal terms. 429 responses
  with Retry-After are expected.
notes: No public rate-limit numbers published. Confirm thresholds via the Anthem developer portal and
  app registration agreement.
sources:
  - https://www.anthem.com/developers
  - https://patient360c.anthem.com/P360Member/fhir/documentation
headers:
  retryAfter: Retry-After
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Patient Access FHIR API
    scope: app
    metric: varies
    limit: see Anthem developer portal
  - name: Provider Directory FHIR API
    scope: ip
    metric: varies
    limit: see Anthem developer portal
  - name: Formulary FHIR API
    scope: ip
    metric: varies
    limit: see Anthem developer portal
  - name: Payer-to-Payer FHIR API
    scope: partner
    metric: varies
    limit: per data-exchange agreement
policies:
  - name: SMART-on-FHIR scopes
    description: Member-authorized endpoints require SMART-on-FHIR auth with member-consent scopes; tokens
      are short-lived and refreshable.
  - name: Backoff
    description: Implement exponential backoff with jitter; honor 429 + Retry-After.
  - name: Application registration
    description: All apps calling Patient Access must be registered with Anthem; CMS rule prohibits
      blocking access but allows rate-limiting and abuse mitigation.
  - name: Public read-only endpoints
    description: Provider Directory and Formulary are public read-only; cache aggressively to minimize
      load.
maintainers:
  - FN: API Evangelist
    email: info@apievangelist.com
