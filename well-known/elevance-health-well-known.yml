description: >-
  Well-known discovery documents published by Elevance Health. The registrable domains
  (elevancehealth.com, anthem.com) serve NO /.well-known documents at their roots — every
  root path 404s or is refused by the edge. The real discovery documents live where the
  FHIR/SMART specifications put them: under each FHIR base URL. Three SMART App Launch
  configurations and one full OpenID Connect discovery document were retrieved anonymously.
notes:
