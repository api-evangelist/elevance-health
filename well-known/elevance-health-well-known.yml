    is the location the SMART App Launch IG mandates. They are genuine documents, not SPA shells.
  - No security.txt, api-catalog, ai-plugin.json, agent-card.json or agent.json was served on
    any host. No llms.txt on any host.
  - www.elevancehealth.com answers 403 (edge bot policy) rather than 404 for the
    /.well-known/*.json paths; recorded as probed-403, not as a served document.
